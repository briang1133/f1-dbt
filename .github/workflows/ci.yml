name: dbt CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: "1"

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/checksums.txt
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/checksums.txt | awk '{print $1 "  /tmp/gitleaks.tar.gz"}' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Scanning PR commits (${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}) and working tree..."
            gitleaks git --config .gitleaks.toml --redact --verbose \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            gitleaks dir . --config .gitleaks.toml --redact --verbose
          else
            echo "Scanning full repository Git history..."
            gitleaks git --config .gitleaks.toml --redact --verbose
          fi

  dbt-slim-ci:
    name: dbt v2 Slim CI (DuckDB + Charts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install dbt v2 (Fusion)
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dbt Charts (dct)
        run: uv tool install dbt-charts

      - name: Verify dbt version
        run: dbt --version

      - name: Cache OpenF1 raw JSON sample
        uses: actions/cache@v4
        with:
          path: data/raw
          key: openf1-raw-2025-limit-1-v1

      - name: Ingest sample OpenF1 race into DuckDB
        run: uv run python scripts/ingest_openf1.py --year 2025 --limit 1

      - name: Download latest production manifest for Slim CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prod-manifest
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch main \
            --status success \
            --limit 20 \
            --json databaseId,workflowName \
            --jq '.[] | select(.workflowName == "dbt CD" or .workflowName == "dbt CI") | .databaseId' \
            | head -n 1 || true)
          if [ -n "$RUN_ID" ]; then
            if gh run download "$RUN_ID" --repo "${{ github.repository }}" -n prod-manifest -D prod-manifest 2>/dev/null; then
              echo "Downloaded prod-manifest from run $RUN_ID"
            else
              echo "No prod-manifest artifact found on run $RUN_ID; falling back to full build."
            fi
          else
            echo "No prior main workflow run found; falling back to full build."
          fi

      - name: Debug dbt connection
        run: dbt debug --target ci

      - name: Parse dbt project
        run: dbt parse --target ci

      - name: Check source freshness
        run: dbt source freshness --target ci

      - name: Build models and run tests (Slim CI when prod-manifest available)
        id: dbt_build
        run: |
          if [ -f prod-manifest/manifest.json ]; then
            echo "### Slim CI Node Selection (\`state:modified+\`)" >> "$GITHUB_STEP_SUMMARY"
            MODIFIED=$(dbt ls --select state:modified+ --state ./prod-manifest --target ci --quiet 2>/dev/null || true)
            if [ -n "$MODIFIED" ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              echo "$MODIFIED" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "Running Slim CI for modified subgraph (+state:modified+)..."
              dbt build --select +state:modified+ --state ./prod-manifest --target ci --static-analysis strict
              echo "full_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "No dbt models modified compared to main — skipping full dbt build." >> "$GITHUB_STEP_SUMMARY"
              echo "full_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "### Full CI Build (no prior \`prod-manifest\` found)" >> "$GITHUB_STEP_SUMMARY"
            dbt build --target ci --static-analysis strict
            echo "full_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint SQL models
        run: dbt lint --target ci

      - name: Validate dbt Charts boards and exposures
        env:
          DBT_TARGET: ci
        run: |
          if [ "${{ steps.dbt_build.outputs.full_build }}" = "true" ]; then
            dct validate --warehouse
          else
            # Fast YAML + ref() + exposure check when Slim CI skipped untouched marts
            dct validate
          fi
          dct exposures --check
