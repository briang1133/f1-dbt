name: dbt CD

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 12:00 UTC (morning after Sunday Grands Prix)
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated F1 season years to ingest (e.g. 2025 2026)"
        required: false
        default: "2025 2026"
        type: string
      full_refresh:
        description: "Force full refresh of incremental dbt models"
        required: false
        default: false
        type: boolean

concurrency:
  group: dbt-cd-prod
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: "1"

jobs:
  deploy-prod:
    name: Deploy to MotherDuck Prod & Build Evidence Reports
    runs-on: ubuntu-latest
    outputs:
      md_configured: ${{ steps.md_check.outputs.configured }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install dbt v2 (Fusion)
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check MotherDuck token configuration
        id: md_check
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          if [ -n "$MOTHERDUCK_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ MotherDuck Prod Token Not Configured Yet"
              echo ""
              echo "Add your MotherDuck access token as a GitHub Actions secret named \`MOTHERDUCK_TOKEN\` to enable cloud production deployments to \`md:f1_prod\`."
              echo ""
              echo "Falling back to generating \`prod-manifest\` locally so PR Slim CI stays active."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache OpenF1 raw JSON archive
        uses: actions/cache@v4
        with:
          path: data/raw
          key: openf1-raw-prod-${{ github.run_id }}
          restore-keys: |
            openf1-raw-prod-
            openf1-raw-2025-

      - name: Ingest completed races incrementally into MotherDuck (md:f1_prod)
        if: steps.md_check.outputs.configured == 'true'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          YEARS="${{ inputs.years || '2025 2026' }}"
          uv run python scripts/ingest_openf1.py \
            --db-path md:f1_prod \
            --year $YEARS \
            --limit 0 \
            --refresh-metadata

      - name: Debug MotherDuck dbt connection
        if: steps.md_check.outputs.configured == 'true'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt debug --target prod

      - name: Check MotherDuck source freshness
        if: steps.md_check.outputs.configured == 'true'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt source freshness --target prod

      - name: Build production dbt project on MotherDuck
        if: steps.md_check.outputs.configured == 'true'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          FLAGS="--target prod --static-analysis strict"
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            FLAGS="$FLAGS --full-refresh"
          fi
          dbt build $FLAGS

      - name: Fallback parse for prod-manifest (when MOTHERDUCK_TOKEN is not yet set)
        if: steps.md_check.outputs.configured == 'false'
        run: dbt parse --target ci

      - name: Upload production manifest artifact (feeds PR Slim CI)
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: target/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js for Evidence.dev static build
        if: steps.md_check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reports/package-lock.json

      - name: Install Evidence.dev dependencies
        if: steps.md_check.outputs.configured == 'true'
        run: npm --prefix reports ci

      - name: Extract MotherDuck prod sources & build Evidence.dev for GitHub Pages
        if: steps.md_check.outputs.configured == 'true'
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          cat > reports/sources/f1_duckdb/connection.yaml <<'EOF'
          name: f1_duckdb
          type: duckdb
          options:
            filename: md:f1_prod
          EOF
          cat >> reports/evidence.config.yaml <<'EOF'

          deployment:
            basePath: /f1-dbt
          EOF
          npm --prefix reports run sources
          npm --prefix reports run build
          touch reports/build/.nojekyll

      - name: Upload Evidence.dev static site artifact
        if: steps.md_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-race-reports
          path: reports/build
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: steps.md_check.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/build

  deploy-pages:
    name: Publish Race Winner Reports to GitHub Pages
    needs: deploy-prod
    if: needs.deploy-prod.outputs.md_configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write CD deployment summary
        run: |
          {
            echo "### ✅ Deployed f1-dbt Production Pipeline & GitHub Pages"
            echo ""
            echo "- **Live Race Reports**: ${{ steps.deployment.outputs.page_url }}"
            echo "- **2026 Las Vegas Breakdown**: ${{ steps.deployment.outputs.page_url }}races/las-vegas-2026"
            echo "- **Warehouse**: MotherDuck \`md:f1_prod\` (\`analytics\` schema)"
          } >> "$GITHUB_STEP_SUMMARY"
