# Generated by `dct exposures` from the boards under charts/.
# Do not edit: change the board and re-run `dct exposures`.
exposures:
- name: f1_team_debrief
  type: dashboard
  owner:
    name: f1-dbt
    email: analytics@example.com
  label: F1 Team Principal Post-Race Debrief
  depends_on:
  - ref('dim_teams')
  - ref('fct_team_debrief')
  - ref('int_stint_degradation')
  config:
    meta:
      dbt_charts:
        board: charts/f1_team_debrief.yml
        queries:
          aero_profile:
          - ref('fct_team_debrief')
          archetype_options:
          - ref('fct_team_debrief')
          archetype_summary:
          - ref('fct_team_debrief')
          deg_by_cspec:
          - ref('int_stint_degradation')
          deg_by_team:
          - ref('fct_team_debrief')
          headline:
          - ref('fct_team_debrief')
          pace_deficit_trend:
          - ref('fct_team_debrief')
          recent_debriefs:
          - ref('fct_team_debrief')
          season_options:
          - ref('fct_team_debrief')
          team_options:
          - ref('dim_teams')
          teammate_spread:
          - ref('fct_team_debrief')
