f1_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: data/f1.duckdb
      schema: analytics
      threads: 4
    ci:
      type: duckdb
      path: data/f1.duckdb
      schema: analytics_ci
      threads: 4
    prod:
      type: duckdb
      # Authenticates automatically via the MOTHERDUCK_TOKEN environment variable
      path: md:f1_prod
      schema: analytics
      threads: 4
